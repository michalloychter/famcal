<div class="calendar-container main-div">
  <div class="calendar-header">
    <h2>{{'FAMILY_CALENDAR' | translate}}</h2>
    
    <div class="google-calendar-controls">
      @if (!isGoogleCalendarConnected()) {
        <button 
          mat-raised-button 
          color="primary" 
          (click)="connectGoogleCalendar()"
          [disabled]="isLoadingGoogleCalendar() || !googleCalendarInitialized()">
          <mat-icon>event</mat-icon>
          @if (!googleCalendarInitialized()) {
            {{'INITIALIZING' | translate}}...
          } @else if (isLoadingGoogleCalendar()) {
            {{'CONNECTING' | translate}}...
          } @else {
            {{'CONNECT_GOOGLE_CALENDAR' | translate}}
          }
        </button>
      } @else {
        <button 
          mat-raised-button 
          color="accent" 
          (click)="disconnectGoogleCalendar()">
          <mat-icon>event_busy</mat-icon>
          {{'DISCONNECT_GOOGLE_CALENDAR' | translate}}
        </button>
      }
    </div>
  </div>
  
  <full-calendar [options]="calendarOptions()"></full-calendar> 
</div>
