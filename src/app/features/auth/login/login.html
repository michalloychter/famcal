<div class="login-container main-div">
  <div class="welcome-screen">
    <div class="greeting-bubble">
      {{ 'Hi, good to see you!' | translate }}
    </div>
   
    <div class="action-buttons">
      <button class="user-bubble-btn" (click)="openLoginForm()">
        {{ 'User' | translate }}
      </button>
  <div class="greeting-bubble">{{ 'Not yet?' | translate }}</div>
      <button class="user-bubble-btn" (click)="goToRegister()">
        {{ 'Register' | translate }}
      </button>
    </div>
  </div>
</div>
