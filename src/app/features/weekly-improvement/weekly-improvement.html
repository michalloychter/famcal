
<form (ngSubmit)="submitImprovement()" class="improvement-form">
	<mat-form-field appearance="outline" style="width:100%;margin-bottom:12px;">
		<mat-label>{{ 'What do you want to improve this week?' | translate }}</mat-label>
		<input matInput id="improvement" name="improvement" [(ngModel)]="improvement" required placeholder="{{ 'What do you want to improve this week?' | translate }}">
	</mat-form-field>
	<div><button class="fam-btn" type="submit" [disabled]="loading">{{ 'Send' | translate }}</button></div>
</form>

<div *ngIf="loading" class="loading-message">{{ 'Loading suggestion...' | translate }}</div>
<div *ngIf="error" class="error-message">{{ error }}</div>

<div *ngIf="aiSuggestions.length > 0">
	<h4>{{ 'AI Suggestions:' | translate }}</h4>
	<div class="ai-suggestion-cards">
		<div *ngFor="let step of aiSuggestions; let i = index" 
				 class="ai-card" 
				 [class.saved-card]="savedCards[i]"
				 [ngStyle]="savedCards[i] ? {'border': '3px solid ' + memberColor} : {}">
			<div class="ai-card-title" *ngIf="step.title">{{ step.title }}</div>
			<div class="ai-card-text">{{ step.details }}</div>
			<div class="ai-card-actions" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
				<button class="fam-btn" type="button" (click)="saveCardAsTask(i, step)" [disabled]="savedCards[i]">
					{{ savedCards[i] ? ('Saved' | translate) + ' ✓' : ('Save for 7 days' | translate) }}
				</button>
			</div>
		</div>
	</div>
	<div style="margin-top: 20px; text-align: center;">
		<button class="fam-btn close-btn" type="button" (click)="closeAndClear()">{{ 'Saved & Close' | translate }}</button>
	</div>
</div>
