<header class="main-header" dir="ltr">
 <div style="display: flex; flex-direction: row;"> <div class="logo" (click)="onLogoClick()" style="cursor:pointer;">
    <div class="logo-circle">
      <span class="logo-fam">fam</span>
      <div class="divider"></div>
      <span class="logo-cal">cal</span>
    </div>
  </div>
 <a *ngIf="authService.currentUser()" (click)="openAllMessages()" [attr.title]="'ALL_MESSAGES' | translate" class="message-header-icon">
  <i class="fa-solid fa-comments"></i>
    </a></div>
  <app-nav-icons [showLabels]="true" navType="header" class="desktop-nav-links"></app-nav-icons>
<div style="display: flex;">
  <div style="position: relative; display: inline-block;">
    <select class="lang-dropdown" [value]="currentLang()" (change)="onLangChange($event)">
      <option value="en">En</option>
      <option value="he">עב</option>
    </select>
  </div>

  <span *ngIf="authService.currentUser()" class="user-menu-container">
    <span class="user-icon" title="Logged in" (click)="toggleUserMenu()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" fill="#888"/>
        <rect x="4" y="16" width="16" height="6" rx="3" fill="#888"/>
      </svg>
    </span>
    <ul class="user-dropdown-menu" *ngIf="userMenuOpen()">
      <li class="user-name">{{ authService.currentUser()?.name || authService.currentUser()?.familyName }}</li>
      <li><a class="main-nav-list" href="#" (click)="logout()">{{ 'LOGOUT' | translate }}</a></li>
    </ul>
  </span>
</div>
</header>
